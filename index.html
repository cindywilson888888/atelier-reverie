<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Atelier Reverie Studio</title>

  <meta name="description" content="Atelier Reverie Studio — artful interiors, textiles and objects inspired by nature, travel and timeless beauty.">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      background: #f7f5f0;
      color: #292722;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;
    }

    .content {
      max-width: 720px;
    }

    .brand {
      font-size: 15px;
      letter-spacing: 5px;
      margin-bottom: 34px;
      text-transform: uppercase;
    }

    h1 {
      font-size: clamp(42px, 8vw, 78px);
      font-weight: normal;
      letter-spacing: 1px;
      margin: 0 0 28px;
    }

    .intro {
      font-size: 19px;
      line-height: 1.8;
      max-width: 600px;
      margin: 0 auto 42px;
    }

    .button {
      display: inline-block;
      padding: 14px 30px;
      border: 1px solid #292722;
      color: #292722;
      text-decoration: none;
      font-family: Arial, sans-serif;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: all 0.3s ease;
    }

    .button:hover {
      background: #292722;
      color: #f7f5f0;
    }

    .footer {
      position: absolute;
      bottom: 28px;
      left: 0;
      right: 0;
      text-align: center;
      font-family: Arial, sans-serif;
      font-size: 11px;
      letter-spacing: 1px;
    }

    .footer a {
      color: #292722;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <main class="hero">
    <div class="content">

      <div class="brand">
        Atelier Reverie Studio
      </div>

      <h1>
        A Reverie for Home
      </h1>

      <p class="intro">
        Artful interiors, textiles and objects inspired by nature,
        travel and timeless beauty.
      </p>

      <a
        class="button"
        href="https://www.etsy.com/shop/AtelierReverieStudio"
        target="_blank"
        rel="noopener noreferrer">
        Explore the Collection
      </a>

    </div>
  </main>

  <div class="footer">
    <a href="/privacypolicy">Privacy Policy</a>
  </div>

</body>
</html>
